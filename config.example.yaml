# Configuration de l'agent SuperviMesh — copier vers /etc/supervimesh/config.yaml
identity:            # identifiants techniques fournis par la plateforme (jamais de nom de personne)
  org: org-demo
  site: site-demo
  gateway: gw-1
uplink:              # broker MQTT sur TLS ; supprimer cette section = mode local seul
  host: mqtt.supervimesh.fr
  port: 8883
  username: gw-1
  password: "à-remplacer"   # fourni par l'assistant « Connecter ma passerelle »
radio:
  transport: serial  # serial | tcp | simulator
  port: /dev/ttyUSB0
polling:             # budget radio : 1 demande de statut par relais toutes les 30 à 60 min
  status_min_interval_min: 30
  status_max_interval_min: 60
managed_repeaters:   # les mots de passe restent sur la passerelle, jamais envoyés au cloud
  - public_key: a1b2c3d4e5f6
    password: "à-remplacer"
    name: Relais Église
sensors:             # capteurs MeshCore relevés (télémétrie : température, humidité, tension…) ; liste vide = aucun
  - public_key: d4e5f6a1b2c3
    name: Capteur Col
    interval_min: 15        # budget radio : un relevé toutes les 15 min (minimum 5), avec un léger délai aléatoire
    # password: "à-remplacer"  # seulement si le capteur réserve sa télémétrie aux invités/administrateurs ; reste local
local_api:           # tableau de bord local : http://<adresse-de-la-passerelle>:8080 (lecture seule)
  enabled: true
  host: 0.0.0.0      # 127.0.0.1 pour le réserver à la passerelle elle-même
  port: 8080
event_log:           # main courante : messages des canaux d'exploitation relayés vers la plateforme
  # Refus par défaut : liste vide = aucun message relayé. N'ajoutez que les canaux d'exploitation
  # (organisation, sécurité) dont les membres ont été informés et ont donné leur accord.
  # Jamais de canal public ni de messages privés (ces derniers ne sont jamais relayés, quoi qu'il arrive).
  # Nom du canal (casse ignorée) ou index : "#1".
  channels: []       # exemple : ["Organisation", "#2"]
  sos_keywords: ["SOS"]   # un message qui commence par l'un de ces mots (ou contient #sos) devient une alerte
buffer_path: /var/lib/supervimesh/buffer.db
log_level: INFO
