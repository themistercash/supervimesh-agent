[project]
name = "supervimesh-agent"
version = "0.1.0"
description = "Agent passerelle SuperviMesh : supervision de réseaux MeshCore"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["meshcore>=2.3", "pydantic>=2.7", "pyyaml>=6", "aiomqtt>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.23"]

[project.scripts]
supervimesh-agent = "supervimesh_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
